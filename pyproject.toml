[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "indiapolicy"
version = "1.0.0"
description = "Empirical assessment of monetary and fiscal policy in India, 2014-2026 (output gaps, Taylor rules, pass-through, fiscal stance)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Himanshu Mahale" }, { name = "Sonali Kumari" },
  { name = "Rudransh Verma" }, { name = "Srishti Rajora" },
]
dependencies = ["numpy>=1.24", "pandas>=2.1", "statsmodels>=0.14", "matplotlib>=3.7"]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
